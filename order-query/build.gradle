// OrderQuery: the read side of the Order domain, an independent build. It depends on the
// query-engine library from the local Maven repository (publish it first:
// `cd ../query-engine && ./gradlew publishToMavenLocal`). query-engine provides the /engine/*
// authoring endpoints and the /data-query runtime endpoint; this service contributes only its
// own database (projection tables + config).
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.brac.order'
version = '0.0.1-SNAPSHOT'

def queryEngineVersion = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenLocal {
		content {
			includeGroup 'com.brac.query'
		}
	}
	mavenCentral()
}

dependencies {
	implementation "com.brac.query:query-engine:${queryEngineVersion}"
}

// Only the executable boot jar is packaged into the image.
tasks.named('jar') {
	enabled = false
}
