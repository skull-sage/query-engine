// InventoryQuery: the read side of the Inventory domain, an independent build. It depends on
// the query-engine library from the local Maven repository (publish it first:
// `cd ../query-engine && ./gradlew publishToMavenLocal`). query-engine provides the /engine/*
// authoring endpoints and the /data-query runtime endpoint; this service contributes only its
// own database (projection tables + config).
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.brac.inventory'
version = '0.0.1-SNAPSHOT'

def queryEngineVersion = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenLocal {
		content {
			includeGroup 'com.brac.query'
		}
	}
	mavenCentral()
}

dependencies {
	implementation "com.brac.query:query-engine:${queryEngineVersion}"
}

// Only the executable boot jar is packaged into the image.
tasks.named('jar') {
	enabled = false
}

// Creates the database logins and permissions query-engine needs, from this service's own
// application.yml (docs/security_protocol.md): the service login (spring.r2dbc.*), the login that owns
// the engine's tables (query-engine.store.*) and the read-only login that runs authors' queries
// (query-engine.projection.*), in the database named in spring.r2dbc.url. Safe to run again, for example
// after changing a password there.
//
//   ./gradlew provision                    # administrator postgres/postgres, the development database
//   QE_ADMIN_USERNAME=dba QE_ADMIN_PASSWORD=... R2DBC_URL=... ./gradlew provision
//   ./gradlew provision --args='--query-engine.provision.dry-run=true'    # print the SQL, connect to nothing
//
// The administrator login belongs to this run only; the running service never has it.
tasks.register('provision', JavaExec) {
group = 'application'
description = 'Creates the database logins and permissions query-engine needs (docs/security_protocol.md)'
classpath = sourceSets.main.runtimeClasspath
mainClass = 'com.brac.query.engine.provision.Provisioner'
environment 'QUERYENGINE_PROVISION_ADMIN_USERNAME', System.getenv('QE_ADMIN_USERNAME') ?: 'postgres'
environment 'QUERYENGINE_PROVISION_ADMIN_PASSWORD', System.getenv('QE_ADMIN_PASSWORD') ?: 'postgres'
}