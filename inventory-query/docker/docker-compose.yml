name: inventory-query
# InventoryQuery stack: the Inventory domain's own Postgres projection store plus the InventoryQuery service.
# Fully independent from the other domain: separate database, network, ports and lifecycle.
services:
  postgres:
    image: postgres:14-alpine
    container_name: inventory-query-postgres
    environment:
      POSTGRES_DB: inventory_query
      # Administrator login (development only): runs the scripts in ./init, which create the service's login
      # and the projection tables. The service never connects as it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      # ./init runs once, when the database is first created: the service's login, then the projection tables.
      # query-engine creates its own table (qe_stored_query) when the service starts.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_query"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Stopping/starting this container (`docker compose stop|start inventory-query`) while Postgres keeps
  # running is the manual check that the service holds no in-memory state.
  inventory-query:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: inventory-query-app
    environment:
      SERVER_PORT: "8082"
      R2DBC_URL: r2dbc:postgresql://postgres:5432/inventory_query
      # The service's one login (created by ./init/00_service_login.sql). Development credentials: in production
      # supply them from a secret manager, not from a compose file.
      DB_USERNAME: inventory_query
      DB_PASSWORD: inventory_query
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
