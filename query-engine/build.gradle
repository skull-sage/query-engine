// query-engine: a standalone library build. It's published to the local Maven repository
// (./gradlew publishToMavenLocal) and consumed by each domain query service's own build as
// com.brac.query:query-engine:<version>.
plugins {
	id 'java-library'
	id 'maven-publish'
}

group = 'com.brac.query'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

def springBootVersion = '4.1.1'

dependencies {
	// The Spring Boot BOM as a Gradle platform, exported with `api` so the published module
	// metadata carries the managed versions to consumers.
	api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

	// Exposed as `api`: every consuming service runs on this reactive stack.
	api 'org.springframework.boot:spring-boot-starter-webflux'
	api 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	api 'org.springframework.boot:spring-boot-starter-validation'
	// Reactive Postgres driver. JsonbSupport references io.r2dbc.postgresql.codec.Json directly.
	implementation 'org.postgresql:r2dbc-postgresql'
	implementation 'io.r2dbc:r2dbc-pool'
	implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
